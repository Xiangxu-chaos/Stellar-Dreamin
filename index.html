<!DOCTYPE html>
<html lang="zh-CN" data-scheme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0f14">
<title>六级单词 · 兴趣化记忆卡片</title>
<meta name="description" content="用你熟悉的兴趣领域记住六级单词。领域化筛选、AI 生成记忆材料、3D 翻转卡片与复习模式。">

<!-- 字体：失败时自动回退到系统字体栈（见 tokens.css 的 font 变量） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./src/styles/tokens.css">
<link rel="stylesheet" href="./src/styles/components.css">
<link rel="stylesheet" href="./src/styles/responsive.css">

<style>
  /* 首屏防闪烁：在 JS 与样式就绪前显示品牌遮罩 */
  html, body { margin: 0; background: #0b0f14; }
  #boot-splash {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    gap: 0;
    background:
      radial-gradient(1100px 760px at 50% -20%, #17222f 0%, transparent 60%),
      linear-gradient(180deg, #0b0f14 0%, #070a0e 100%);
    z-index: 9999;
    transition: opacity 0.5s ease;
    font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  #boot-splash .splash-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    color: #9aa9b8;
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  #boot-splash .splash-mark {
    width: 52px; height: 52px;
    border-radius: 15px;
    border: 1px solid rgba(143, 214, 192, 0.3);
    background: linear-gradient(150deg, rgba(143,214,192,0.18), rgba(110,168,254,0.08));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 10px 30px -12px rgba(110,168,254,0.8);
    display: grid; place-items: center;
    color: #8fd6c0;
    animation: splash-pulse 2s ease-in-out infinite;
  }
  #boot-splash .splash-mark svg { width: 26px; height: 26px; }
  @keyframes splash-pulse {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.06); opacity: 1; }
  }
  #boot-splash .splash-bar {
    width: 168px; height: 2px; border-radius: 99px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }
  #boot-splash .splash-bar i {
    display: block; height: 100%; width: 40%;
    border-radius: 99px;
    background: linear-gradient(90deg, transparent, #6ea8fe, #8fd6c0, transparent);
    animation: splash-slide 1.3s ease-in-out infinite;
  }
  @keyframes splash-slide {
    0% { transform: translateX(-110%); }
    100% { transform: translateX(280%); }
  }

  /* ---- 启动骨架屏（首屏立刻可见，不依赖任何 JS / 网络） ---- */
  #boot-splash .splash-title {
    color: #dbe6f2;
    font-size: 14px;
    letter-spacing: 0.03em;
    text-transform: none;
    font-weight: 600;
  }
  #boot-splash .splash-hint {
    margin-top: -8px;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: #7d8b9c;
    text-transform: none;
  }
  #boot-splash .splash-skeleton {
    display: grid;
    grid-template-columns: repeat(3, 92px);
    gap: 12px;
    margin-top: 6px;
  }
  #boot-splash .sk-card {
    position: relative;
    overflow: hidden;
    display: block;
    height: 74px;
    border-radius: 11px;
    border: 1px solid rgba(255,255,255,0.07);
    background: rgba(128,132,148,0.10);
  }
  #boot-splash .sk-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent 20%, rgba(143,214,192,0.16) 50%, transparent 80%);
    animation: skeleton-shimmer 1.4s ease-in-out infinite;
  }
  @keyframes skeleton-shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  #boot-splash .splash-retry {
    margin-top: 4px;
    padding: 8px 18px;
    border-radius: 99px;
    border: 1px solid rgba(143,214,192,0.4);
    background: rgba(143,214,192,0.12);
    color: #8fd6c0;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  #boot-splash.is-fading { opacity: 0; pointer-events: none; }
</style>

<!-- 后端：自建 Cloudflare Worker + D1（https://api.stellar-dreamin.site）
     无需引入任何第三方 SDK —— 注册 / 登录 / 上报全部走原生 fetch，
     见 src/core/authService.js -->
</head>
<body>
  <div id="app"></div>

  <!-- 启动骨架屏：纯静态 HTML + CSS，页面一解析完就立刻可见（不依赖 JS / 网络）。
       主脚本（src/main.js）会在挂载登录页或主界面后立刻移除它；
       万一模块脚本加载失败，下方的内联兜底脚本会在 3.5s 后给出重试入口。 -->
  <div id="boot-splash" aria-hidden="true">
    <div class="splash-inner">
      <div class="splash-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>
          <path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>
        </svg>
      </div>
      <div class="splash-title">六级单词 · 兴趣化记忆卡片</div>
      <div class="splash-bar"><i></i></div>
      <div class="splash-hint" id="boot-hint">加载中…</div>
      <div class="splash-skeleton">
        <span class="sk-card"></span><span class="sk-card"></span><span class="sk-card"></span>
      </div>
    </div>
  </div>

  <noscript>
    <div style="padding:40px;font-family:system-ui;color:#e8eef5">
      本应用需要 JavaScript 才能运行，请在浏览器设置中启用后刷新页面。
    </div>
  </noscript>

  <script type="module" src="./src/main.js"></script>

  <!-- 启动兜底：主脚本自身带 3s 超时；这里再兜一层 —— 若 3.5s 后骨架屏
       仍未被移除（通常意味着模块脚本没加载成功），给出可见的重试入口。
       绝不使用外部资源，纯内联。 -->
  <script>
  (function () {
    var FAILSAFE_MS = 3500;
    window.__bootSplashTimer = setTimeout(function () {
      var splash = document.getElementById('boot-splash');
      if (!splash) return;
      var hint = document.getElementById('boot-hint');
      if (hint) hint.textContent = '启动较慢或加载失败';
      if (document.getElementById('boot-retry')) return;
      var inner = splash.querySelector('.splash-inner');
      if (!inner) return;
      var btn = document.createElement('button');
      btn.id = 'boot-retry';
      btn.className = 'splash-retry';
      btn.type = 'button';
      btn.textContent = '重新载入';
      btn.addEventListener('click', function () { window.location.reload(); });
      inner.appendChild(btn);
    }, FAILSAFE_MS);
  })();
  </script>
</body>
</html>
